<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">OptiVector</title><desc id="d">Converts PNG, JPG and WEBP images into clean, scalable SVG paths. Pixels on the left become a smooth path with anchor points on the right.</desc>
